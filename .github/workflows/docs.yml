name: Docs

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

# Do not cancel a master deploy that is already publishing.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  docs:
    name: Doxygen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          submodules: false
          persist-credentials: false

      - name: Install Doxygen 1.18.0
        run: |
          set -euo pipefail
          archive=doxygen-1.18.0.linux.bin.tar.gz
          curl -fsSL -o "$archive" \
            "https://github.com/doxygen/doxygen/releases/download/Release_1_18_0/${archive}"
          # GitHub release asset digest for the official Linux binary archive.
          echo "14fa81bdc34171edb5f1f02b1d60e74802f0439b77fa44e592565d517d72df90  ${archive}" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/doxygen"
          tar -xzf "$archive" -C "$RUNNER_TEMP/doxygen"
          bin=$(find "$RUNNER_TEMP/doxygen" -type f -name doxygen | head -n 1)
          if [ -z "$bin" ]; then
            echo "doxygen binary not found in the official archive" >&2
            exit 1
          fi
          echo "$(dirname "$bin")" >> "$GITHUB_PATH"
          version=$("$bin" --version)
          echo "$version"
          printf '%s\n' "$version" | grep -q '^1.18.0'

      - name: Lint API comments
        run: |
          set -euo pipefail
          rm -rf docs/html
          { cat Doxyfile; echo; echo "WARN_AS_ERROR = YES"; } | doxygen -
          test -f docs/html/index.html

      - name: Check documentation output
        run: python3 .github/scripts/check_doxygen_html.py docs/html

      - name: Upload HTML preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: doxygen-html
          path: docs/html
          if-no-files-found: error

  # Upload and deploy stay in separate jobs. actions/deploy-pages lists artifacts
  # as soon as it starts and misses a github-pages artifact finalized in the
  # same job (actions/deploy-pages#451). Re-running that failed job uploads a
  # second github-pages artifact, which then fails the lookup permanently.
  pages:
    name: Upload Pages artifact
    needs: docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Download validated HTML
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: doxygen-html
          path: docs/html

      - name: Require the validated site root
        run: test -f docs/html/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs/html

  deploy:
    name: GitHub Pages
    needs: pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      actions: read
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Wait until the Pages artifact is listed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            count=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')
            if [ "$count" = "1" ]; then
              echo "github-pages artifact is listed"
              exit 0
            fi
            if [ "$count" -gt 1 ]; then
              echo "expected one github-pages artifact, found ${count}" >&2
              exit 1
            fi
            echo "attempt ${attempt}: github-pages artifact is not listed yet"
            sleep 2
          done
          echo "github-pages artifact was not listed for this run" >&2
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
