name: Setup vcpkg dependencies
description: Initialize, bootstrap, restore cache for, install, and cache a scoped set of vcpkg dependencies.

inputs:
  triplet:
    description: vcpkg target triplet (e.g. x86-windows-static or x64-windows-static)
    required: true
  cache-scope:
    description: Cache namespace for this job slice (e.g. core, samples, opencv)
    required: true
  features:
    description: Space-separated manifest features to install (empty for core dependencies only)
    required: false
    default: ''
  save-cache:
    description: Whether to save vcpkg-archives to Actions cache after install
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Init vcpkg submodule (shallow)
      shell: pwsh
      run: git submodule update --init --depth 1 vcpkg

    - name: Bootstrap vcpkg
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        & .\.github\scripts\Bootstrap-VcpkgOnce.ps1
        if ($LASTEXITCODE -ne 0) { throw "bootstrap-vcpkg failed ($LASTEXITCODE)" }

    - name: Resolve vcpkg cache key
      id: cache-meta
      shell: pwsh
      env:
        VCPKG_TRIPLET: ${{ inputs.triplet }}
        VCPKG_FEATURES: ${{ inputs.features }}
      run: |
        $ErrorActionPreference = 'Stop'
        $vcpkgSha = git rev-parse "HEAD:vcpkg"
        if ($LASTEXITCODE -ne 0) { throw "git rev-parse HEAD:vcpkg failed ($LASTEXITCODE)" }

        $toolset = $env:ImageVersion
        $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
        if (Test-Path -LiteralPath $vswhere) {
          $found = @(
            & $vswhere -latest -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -find 'VC\Tools\MSVC\*\bin\Hostx64\x64\cl.exe'
          ) | Where-Object { $_ }
          $cl = $found | Sort-Object -Descending | Select-Object -First 1
          if ($cl) {
            $toolset = Split-Path -Leaf (Split-Path -Parent (Split-Path -Parent (Split-Path -Parent (Split-Path -Parent $cl))))
          }
        }
        if (-not $toolset) { throw 'Could not resolve an MSVC toolset version or ImageVersion.' }

        function ConvertTo-CanonicalJson([object]$Value) {
          if ($null -eq $Value) { return 'null' }
          if ($Value -is [string]) { return ($Value | ConvertTo-Json -Compress) }
          if ($Value -is [bool] -or $Value -is [int] -or $Value -is [long] -or $Value -is [double] -or $Value -is [decimal]) {
            return ($Value | ConvertTo-Json -Compress)
          }
          if ($Value -is [System.Collections.IDictionary]) {
            $pairs = foreach ($key in (@($Value.Keys) | Sort-Object)) {
              (($key | ConvertTo-Json -Compress) + ':' + (ConvertTo-CanonicalJson $Value[$key]))
            }
            return '{' + ($pairs -join ',') + '}'
          }
          if ($Value -is [System.Collections.IList]) {
            $items = foreach ($item in $Value) { ConvertTo-CanonicalJson $item }
            return '[' + ($items -join ',') + ']'
          }
          $props = @($Value.PSObject.Properties)
          if ($Value -is [System.Management.Automation.PSCustomObject]) {
            $pairs = foreach ($prop in ($props | Sort-Object Name)) {
              (($prop.Name | ConvertTo-Json -Compress) + ':' + (ConvertTo-CanonicalJson $prop.Value))
            }
            return '{' + ($pairs -join ',') + '}'
          }
          return ($Value | ConvertTo-Json -Compress -Depth 30)
        }

        $manifest = Get-Content -LiteralPath 'vcpkg.json' -Raw | ConvertFrom-Json
        $featureNames = @()
        if ($env:VCPKG_FEATURES) {
          $featureNames = @($env:VCPKG_FEATURES.Trim() -split '\s+' | Where-Object { $_ })
        }
        $selectedFeatures = [ordered]@{}
        foreach ($name in $featureNames) {
          $feature = $manifest.features.$name
          if ($null -eq $feature) { throw "vcpkg.json has no feature '$name'." }
          $selectedFeatures[$name] = $feature
        }
        $slice = [ordered]@{
          dependencies = $manifest.dependencies
          supports = $manifest.supports
          features = $selectedFeatures
        }

        $tripletFile = Join-Path '.github\vcpkg-triplets' ($env:VCPKG_TRIPLET + '.cmake')
        if (-not (Test-Path -LiteralPath $tripletFile)) { throw "Missing overlay triplet $tripletFile" }
        $payload = @(
          (Get-Content -LiteralPath 'vcpkg-configuration.json' -Raw)
          (ConvertTo-CanonicalJson $slice)
          (Get-Content -LiteralPath $tripletFile -Raw)
        ) -join "`n"
        $hashBytes = [System.Security.Cryptography.SHA256]::HashData([System.Text.Encoding]::UTF8.GetBytes($payload))
        $depsHash = [System.Convert]::ToHexString($hashBytes).ToLowerInvariant()

        "vcpkg-sha=$vcpkgSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "toolset=$toolset" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "deps-hash=$depsHash" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        Write-Output "vcpkg $vcpkgSha (toolset=$toolset, deps=$depsHash)"

    - name: Restore vcpkg binary archives
      id: cache-restore
      uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: vcpkg-archives
        # The toolset segment is the MSVC directory version. vcpkg checks each
        # archive's ABI hash, so a restore from another toolset is not reused.
        key: vcpkg-v4-${{ inputs.cache-scope }}-${{ inputs.triplet }}-${{ steps.cache-meta.outputs.deps-hash }}-${{ steps.cache-meta.outputs.vcpkg-sha }}-${{ steps.cache-meta.outputs.toolset }}
        restore-keys: |
          vcpkg-v4-${{ inputs.cache-scope }}-${{ inputs.triplet }}-${{ steps.cache-meta.outputs.deps-hash }}-${{ steps.cache-meta.outputs.vcpkg-sha }}-${{ steps.cache-meta.outputs.toolset }}-partial-
          vcpkg-v4-${{ inputs.cache-scope }}-${{ inputs.triplet }}-${{ steps.cache-meta.outputs.deps-hash }}-${{ steps.cache-meta.outputs.vcpkg-sha }}-

    - name: Configure vcpkg files binary cache
      shell: pwsh
      run: |
        $archives = (Join-Path $env:GITHUB_WORKSPACE 'vcpkg-archives').Replace('\', '/')
        New-Item -ItemType Directory -Force -Path $archives | Out-Null
        "VCPKG_BINARY_SOURCES=clear;files,$archives,readwrite" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Configure vcpkg NuGet binary cache
      if: ${{ env.VCPKG_NUGET_TOKEN != '' }}
      shell: pwsh
      env:
        REPO_OWNER: ${{ github.repository_owner }}
      run: |
        $ErrorActionPreference = 'Stop'
        $nugetExe = & .\vcpkg\vcpkg.exe fetch nuget | Select-Object -Last 1
        if ($LASTEXITCODE -ne 0) { throw "vcpkg fetch nuget failed ($LASTEXITCODE)" }
        $sourceUrl = "https://nuget.pkg.github.com/$env:REPO_OWNER/index.json"
        & $nugetExe sources add `
          -Name "GitHubPackages" `
          -Source $sourceUrl `
          -Username "$env:REPO_OWNER" `
          -Password "$env:VCPKG_NUGET_TOKEN" `
          -StorePasswordInClearText
        if ($LASTEXITCODE -ne 0) { throw "nuget sources add failed ($LASTEXITCODE)" }
        & $nugetExe setapikey "$env:VCPKG_NUGET_TOKEN" `
          -Source $sourceUrl
        if ($LASTEXITCODE -ne 0) { throw "nuget setapikey failed ($LASTEXITCODE)" }
        "VCPKG_BINARY_SOURCES=$env:VCPKG_BINARY_SOURCES;nuget,$sourceUrl,readwrite;nugettimeout,1800" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "VCPKG_NUGET_PUSH_OPTIONS=-SkipDuplicate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Install vcpkg dependencies
      id: vcpkg-install
      shell: pwsh
      env:
        VCPKG_TRIPLET: ${{ inputs.triplet }}
        VCPKG_FEATURES: ${{ inputs.features }}
      run: |
        $ErrorActionPreference = 'Stop'
        $installRoot = Join-Path $env:GITHUB_WORKSPACE "vcpkg_installed\$env:VCPKG_TRIPLET"
        $overlayTriplets = Join-Path $env:GITHUB_WORKSPACE '.github\vcpkg-triplets'
        $vcpkgRoot = Join-Path $env:GITHUB_WORKSPACE 'vcpkg'
        $vcpkgArgs = @(
          'install',
          '--x-wait-for-lock',
          '--triplet', $env:VCPKG_TRIPLET,
          "--x-manifest-root=$env:GITHUB_WORKSPACE",
          "--x-install-root=$installRoot",
          "--overlay-triplets=$overlayTriplets",
          "--vcpkg-root=$vcpkgRoot",
          '--x-no-default-features'
        )
        $featureList = if ($env:VCPKG_FEATURES) { $env:VCPKG_FEATURES.Trim() } else { '' }
        if ($featureList) {
          foreach ($feature in ($featureList -split '\s+')) {
            $vcpkgArgs += "--x-feature=$feature"
          }
        }
        Write-Output "Running: .\vcpkg\vcpkg.exe $($vcpkgArgs -join ' ')"
        & .\vcpkg\vcpkg.exe @vcpkgArgs
        if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed ($LASTEXITCODE)" }

    - name: Check vcpkg binary archives
      id: archives-check
      if: ${{ always() && inputs.save-cache == 'true' && steps.cache-restore.outputs.cache-hit != 'true' }}
      shell: pwsh
      run: |
        $hasFiles = $false
        if (Test-Path -LiteralPath 'vcpkg-archives') {
          $hasFiles = @(Get-ChildItem -LiteralPath 'vcpkg-archives' -Recurse -File | Select-Object -First 1).Count -gt 0
        }
        "has-archives=$($hasFiles.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Save vcpkg binary archives
      if: ${{ steps.vcpkg-install.outcome == 'success' && inputs.save-cache == 'true' && steps.cache-restore.outputs.cache-hit != 'true' && steps.archives-check.outputs.has-archives == 'true' }}
      uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: vcpkg-archives
        key: vcpkg-v4-${{ inputs.cache-scope }}-${{ inputs.triplet }}-${{ steps.cache-meta.outputs.deps-hash }}-${{ steps.cache-meta.outputs.vcpkg-sha }}-${{ steps.cache-meta.outputs.toolset }}

    - name: Save partial vcpkg binary archives on failure
      if: ${{ always() && steps.vcpkg-install.outcome == 'failure' && inputs.save-cache == 'true' && steps.cache-restore.outputs.cache-hit != 'true' && steps.archives-check.outputs.has-archives == 'true' }}
      uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: vcpkg-archives
        key: vcpkg-v4-${{ inputs.cache-scope }}-${{ inputs.triplet }}-${{ steps.cache-meta.outputs.deps-hash }}-${{ steps.cache-meta.outputs.vcpkg-sha }}-${{ steps.cache-meta.outputs.toolset }}-partial-${{ github.run_id }}-${{ github.run_attempt }}
