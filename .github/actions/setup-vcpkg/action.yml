name: Setup vcpkg dependencies
description: Initialize, bootstrap, restore cache for, install, and cache a scoped set of vcpkg dependencies.

inputs:
  triplet:
    description: vcpkg target triplet (e.g. x86-windows-static or x64-windows-static)
    required: true
  cache-scope:
    description: Cache namespace for this job slice (e.g. core, samples, opencv)
    required: true
  features:
    description: Space-separated manifest features to install (empty for core dependencies only)
    required: false
    default: ''
  save-cache:
    description: Whether to save vcpkg-archives to Actions cache after install
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Init vcpkg submodule (shallow)
      shell: pwsh
      run: git submodule update --init --depth 1 vcpkg

    - name: Bootstrap vcpkg
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        & .\.github\scripts\Bootstrap-VcpkgOnce.ps1
        if ($LASTEXITCODE -ne 0) { throw "bootstrap-vcpkg failed ($LASTEXITCODE)" }

    - name: Resolve vcpkg cache key
      id: cache-meta
      shell: pwsh
      run: |
        $ErrorActionPreference = 'Stop'
        $vcpkgSha = git rev-parse "HEAD:vcpkg"
        if ($LASTEXITCODE -ne 0) { throw "git rev-parse HEAD:vcpkg failed ($LASTEXITCODE)" }
        $imageVersion = $env:ImageVersion
        "vcpkg-sha=$vcpkgSha" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        "image-version=$imageVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
        Write-Output "vcpkg $vcpkgSha (ImageVersion=$imageVersion)"

    - name: Restore vcpkg binary archives
      id: cache-restore
      uses: actions/cache/restore@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: vcpkg-archives
        # vcpkg checks each archive's ABI hash, so a restore without ImageVersion
        # ignores packages built by an older runner image.
        key: vcpkg-v3-${{ inputs.cache-scope }}-${{ inputs.triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ steps.cache-meta.outputs.vcpkg-sha }}-${{ steps.cache-meta.outputs.image-version }}
        restore-keys: |
          vcpkg-v3-${{ inputs.cache-scope }}-${{ inputs.triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ steps.cache-meta.outputs.vcpkg-sha }}-${{ steps.cache-meta.outputs.image-version }}-partial-
          vcpkg-v3-${{ inputs.cache-scope }}-${{ inputs.triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ steps.cache-meta.outputs.vcpkg-sha }}-

    - name: Configure vcpkg files binary cache
      shell: pwsh
      run: |
        $archives = (Join-Path $env:GITHUB_WORKSPACE 'vcpkg-archives').Replace('\', '/')
        New-Item -ItemType Directory -Force -Path $archives | Out-Null
        "VCPKG_BINARY_SOURCES=clear;files,$archives,readwrite" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Configure vcpkg NuGet binary cache
      if: ${{ env.VCPKG_NUGET_TOKEN != '' }}
      shell: pwsh
      env:
        REPO_OWNER: ${{ github.repository_owner }}
      run: |
        $ErrorActionPreference = 'Stop'
        $nugetExe = & .\vcpkg\vcpkg.exe fetch nuget | Select-Object -Last 1
        if ($LASTEXITCODE -ne 0) { throw "vcpkg fetch nuget failed ($LASTEXITCODE)" }
        $sourceUrl = "https://nuget.pkg.github.com/$env:REPO_OWNER/index.json"
        & $nugetExe sources add `
          -Name "GitHubPackages" `
          -Source $sourceUrl `
          -Username "$env:REPO_OWNER" `
          -Password "$env:VCPKG_NUGET_TOKEN" `
          -StorePasswordInClearText
        if ($LASTEXITCODE -ne 0) { throw "nuget sources add failed ($LASTEXITCODE)" }
        & $nugetExe setapikey "$env:VCPKG_NUGET_TOKEN" `
          -Source $sourceUrl
        if ($LASTEXITCODE -ne 0) { throw "nuget setapikey failed ($LASTEXITCODE)" }
        "VCPKG_BINARY_SOURCES=$env:VCPKG_BINARY_SOURCES;nuget,$sourceUrl,readwrite;nugettimeout,1800" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        "VCPKG_NUGET_PUSH_OPTIONS=-SkipDuplicate" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Install vcpkg dependencies
      id: vcpkg-install
      shell: pwsh
      env:
        VCPKG_TRIPLET: ${{ inputs.triplet }}
        VCPKG_FEATURES: ${{ inputs.features }}
      run: |
        $ErrorActionPreference = 'Stop'
        $installRoot = Join-Path $env:GITHUB_WORKSPACE "vcpkg_installed\$env:VCPKG_TRIPLET"
        $vcpkgArgs = @(
          'install',
          '--x-wait-for-lock',
          '--triplet', $env:VCPKG_TRIPLET,
          "--x-manifest-root=$env:GITHUB_WORKSPACE",
          "--x-install-root=$installRoot",
          '--x-no-default-features'
        )
        $featureList = if ($env:VCPKG_FEATURES) { $env:VCPKG_FEATURES.Trim() } else { '' }
        if ($featureList) {
          foreach ($feature in ($featureList -split '\s+')) {
            $vcpkgArgs += "--x-feature=$feature"
          }
        }
        Write-Output "Running: .\vcpkg\vcpkg.exe $($vcpkgArgs -join ' ')"
        & .\vcpkg\vcpkg.exe @vcpkgArgs
        if ($LASTEXITCODE -ne 0) { throw "vcpkg install failed ($LASTEXITCODE)" }

    - name: Check vcpkg binary archives
      id: archives-check
      if: ${{ always() && inputs.save-cache == 'true' && steps.cache-restore.outputs.cache-hit != 'true' }}
      shell: pwsh
      run: |
        $hasFiles = $false
        if (Test-Path -LiteralPath 'vcpkg-archives') {
          $hasFiles = @(Get-ChildItem -LiteralPath 'vcpkg-archives' -Recurse -File | Select-Object -First 1).Count -gt 0
        }
        "has-archives=$($hasFiles.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

    - name: Save vcpkg binary archives
      if: ${{ steps.vcpkg-install.outcome == 'success' && inputs.save-cache == 'true' && steps.cache-restore.outputs.cache-hit != 'true' && steps.archives-check.outputs.has-archives == 'true' }}
      uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: vcpkg-archives
        key: vcpkg-v3-${{ inputs.cache-scope }}-${{ inputs.triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ steps.cache-meta.outputs.vcpkg-sha }}-${{ steps.cache-meta.outputs.image-version }}

    - name: Save partial vcpkg binary archives on failure
      if: ${{ always() && steps.vcpkg-install.outcome == 'failure' && inputs.save-cache == 'true' && steps.cache-restore.outputs.cache-hit != 'true' && steps.archives-check.outputs.has-archives == 'true' }}
      uses: actions/cache/save@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
      with:
        path: vcpkg-archives
        key: vcpkg-v3-${{ inputs.cache-scope }}-${{ inputs.triplet }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ steps.cache-meta.outputs.vcpkg-sha }}-${{ steps.cache-meta.outputs.image-version }}-partial-${{ github.run_id }}-${{ github.run_attempt }}
